name: An idea / 有个想法
description: Share something that might be useful or fun / 分享一个可能实用或好玩的点子
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Rough ideas are welcome. Links or screenshots from things such as Control Bar Pro or GenTool can help explain the inspiration; they do not need to be formal specifications.

        不完整的想法也欢迎。可以用 Control Bar Pro、GenTool 等项目的链接或截图解释灵感，不需要先写成正式需求文档。

  - type: textarea
    id: idea
    attributes:
      label: What is the idea? / 想到了什么？
      description: Describe the useful or fun part in your own words / 用自己的话说说实用或好玩的地方
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: References or extra thoughts / 参考或补充
      description: Optional links, screenshots, affected platforms, or anything else / 选填；可以放链接、截图、相关平台或其他补充
