name: Bug report / 错误报告
description: Report a reproducible problem in this fork / 报告本 fork 中可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this fork. Please do not upload commercial game data, an app or IPA containing game data, Apple signing material, device identifiers, or account information.

        感谢你协助改进本 fork。请勿上传商业游戏资源、包含资源的 App / IPA、Apple 签名资料、设备标识或账号信息。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites / 提交前确认
      options:
        - label: I searched existing issues and did not find the same report. / 我已搜索现有 Issues，没有发现相同报告。
          required: true
        - label: I can reproduce this with this fork, not only with an unrelated mod or patch. / 我能在本 fork 中复现，而不是只在无关 MOD 或补丁中出现。
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Apple Silicon macOS
        - iOS / iPadOS (experimental fork build / 本 fork 实验构建)
        - Linux
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Game / 游戏
      options:
        - Command & Conquer Generals: Zero Hour
        - Command & Conquer Generals
        - Both / 两者
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Fork revision / Fork 版本
      description: Commit hash, branch, or release name / commit、分支或 release 名称
      placeholder: main @ 0123456
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Device model, OS version, game language, window/fullscreen mode, resolution, Retina/HiDPI mode, and any mods or unofficial fixes / 设备、系统、游戏语言、窗口或全屏、分辨率、Retina/HiDPI、MOD 与非官方修复
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior / 实际与预期结果
      description: Explain what happened and what should have happened / 说明实际发生了什么，以及你认为应当发生什么
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps / 复现步骤
      placeholder: |
        1. Launch with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs and additional context / 日志与补充信息
      description: Attach a small redacted log or screenshot when useful. State whether the problem is intermittent. / 可附上已脱敏的小段日志或截图，并说明问题是否偶发。

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and assets / 隐私与资源
      options:
        - label: I removed commercial game assets, signing data, device identifiers, account details, and private paths. / 我已移除商业资源、签名资料、设备标识、账号信息和私人路径。
          required: true
