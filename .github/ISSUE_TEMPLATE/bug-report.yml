name: Something went wrong / 遇到了问题
description: Share a bug or odd behavior / 说说遇到的错误或奇怪现象
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This is a small personal fork, so a simple description is fine. Screenshots and short logs are welcome, but please do not upload retail game data, an app or IPA containing it, or private signing information.

        这是个小型个人 fork，简单说清楚就可以。欢迎附截图或短日志，但请勿上传正版游戏资源、包含资源的 App / IPA 或私人签名资料。

  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Apple Silicon macOS
        - iOS / iPadOS
        - Linux
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened? / 发生了什么？
      description: A plain description is enough. Mention what you expected if it helps. / 直接描述现象即可，必要时也可以说说原本希望怎样。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can it happen again? / 怎样可以再次遇到？
      description: Optional, but useful for repeatable problems / 选填；如果可以稳定复现会很有帮助
      placeholder: |
        1. Launch with ...
        2. Open ...
        3. Observe ...
  - type: textarea
    id: context
    attributes:
      label: Anything else? / 其他信息
      description: Device, OS, resolution, window/fullscreen mode, mods, screenshots, or short logs—whatever seems relevant / 设备、系统、分辨率、窗口或全屏、MOD、截图、短日志，觉得有关的都可以写
